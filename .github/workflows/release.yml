name: Publish Windows release
on:
  push:
    branches: [main]
    paths:
      - package.json
      - .github/workflows/release.yml
      - docs/releases/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check release version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content 'package.json' -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?$') { throw 'Invalid release version' }
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag --json id 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            'publish=false' >> $env:GITHUB_OUTPUT
            Write-Output "Release $tag already exists; leaving it unchanged."
          } else {
            'publish=true' >> $env:GITHUB_OUTPUT
          }
          exit 0
      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci
      - name: Run tests
        if: steps.version.outputs.publish == 'true'
        run: npm test
      - name: Build offline Windows installer
        if: steps.version.outputs.publish == 'true'
        run: npm run build:win
      - name: Test installation, launch and uninstallation
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/test-installer.ps1
      - name: Package committed source
        if: steps.version.outputs.publish == 'true'
        run: npm run pack:source
      - name: Assemble release pack
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/pack-release.ps1
      - name: Generate SHA-256 checksums
        if: steps.version.outputs.publish == 'true'
        run: npm run checksums
      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $v = $env:RELEASE_VERSION
          gh release create $env:RELEASE_TAG "release/Repo-Map-Setup-$v-x64.exe" "release/Repo-Map-Source-$v.zip" "release/Repo-Map-Release-Pack-$v.zip" 'release/SHA256SUMS.txt' --target $env:GITHUB_SHA --title "Repo Map $v" --notes-file "docs/releases/v$v.md" --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: Repo-Map-Release-Pack
          path: |
            release/*.exe
            release/*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
